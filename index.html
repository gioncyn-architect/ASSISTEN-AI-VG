<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASISTEN AI VG</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI VG">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{--transition:all 0.4s cubic-bezier(0.16,1,0.3,1);--radius:16px;--font-main:'Sora',sans-serif;--font-mono:'JetBrains Mono',monospace;}
body.theme-1{--bg:#050505;--sidebar-bg:#0A0A0A;--accent:#D4AF37;--accent2:#B8960C;--border:rgba(212,175,55,0.18);--glass:rgba(212,175,55,0.04);--neon:0 0 18px rgba(212,175,55,0.45);--bg-grad:radial-gradient(ellipse 80% 60% at 20% 0%,#1a1200 0%,#050505 60%);--bubble-ai:rgba(20,16,0,0.7);--text-dim:rgba(255,255,255,0.45);}
body.theme-2{--bg:#060D14;--sidebar-bg:#08121D;--accent:#00E5CC;--accent2:#00BFA5;--border:rgba(0,229,204,0.16);--glass:rgba(0,229,204,0.04);--neon:0 0 18px rgba(0,229,204,0.4);--bg-grad:radial-gradient(ellipse 70% 50% at 15% 20%,#002a2a 0%,#060D14 55%),radial-gradient(ellipse 50% 40% at 85% 80%,#001f35 0%,transparent 60%);--bubble-ai:rgba(0,15,18,0.75);--text-dim:rgba(255,255,255,0.45);}
body.theme-3{--bg:#160F0A;--sidebar-bg:#1E1510;--accent:#C49A6C;--accent2:#A8784A;--border:rgba(196,154,108,0.18);--glass:rgba(196,154,108,0.05);--neon:0 0 18px rgba(196,154,108,0.4);--bg-grad:radial-gradient(ellipse 80% 55% at 80% 10%,#2a1a0e 0%,#160F0A 60%);--bubble-ai:rgba(26,15,8,0.75);--text-dim:rgba(255,255,255,0.45);}
body.theme-4{--bg:#0C0A18;--sidebar-bg:#120F22;--accent:#A78BFA;--accent2:#8B6FDE;--border:rgba(167,139,250,0.18);--glass:rgba(167,139,250,0.05);--neon:0 0 18px rgba(167,139,250,0.4);--bg-grad:radial-gradient(ellipse 75% 50% at 25% 70%,#1a0f38 0%,#0C0A18 55%);--bubble-ai:rgba(12,10,30,0.75);--text-dim:rgba(255,255,255,0.45);}
body.theme-5{--bg:#0F0708;--sidebar-bg:#180B0D;--accent:#F87171;--accent2:#E05555;--border:rgba(248,113,113,0.18);--glass:rgba(248,113,113,0.04);--neon:0 0 18px rgba(248,113,113,0.4);--bg-grad:radial-gradient(ellipse 80% 55% at 70% 10%,#2a0808 0%,#0F0708 60%);--bubble-ai:rgba(20,7,8,0.75);--text-dim:rgba(255,255,255,0.45);}
body.theme-6{--bg:#080E0A;--sidebar-bg:#0D1610;--accent:#86EFAC;--accent2:#60D08E;--border:rgba(134,239,172,0.16);--glass:rgba(134,239,172,0.04);--neon:0 0 18px rgba(134,239,172,0.35);--bg-grad:radial-gradient(ellipse 75% 50% at 10% 80%,#0a1f10 0%,#080E0A 55%);--bubble-ai:rgba(6,14,8,0.75);--text-dim:rgba(255,255,255,0.45);}
body.theme-7{--bg:#070D1A;--sidebar-bg:#0B1428;--accent:#60C8FF;--accent2:#38A8E0;--border:rgba(96,200,255,0.16);--glass:rgba(96,200,255,0.04);--neon:0 0 18px rgba(96,200,255,0.4);--bg-grad:radial-gradient(ellipse 75% 50% at 75% 10%,#0a1f35 0%,#070D1A 55%);--bubble-ai:rgba(6,12,28,0.75);--text-dim:rgba(255,255,255,0.45);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-main);background:var(--bg);background-image:var(--bg-grad);color:#fff;height:100dvh;display:flex;overflow:hidden;transition:background 0.5s ease;}
#sidebar{width:290px;min-width:290px;height:100%;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:var(--transition);z-index:1000;backdrop-filter:blur(20px);}
#sidebar.closed{margin-left:-290px;}
.logo-box{padding:24px 20px 18px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.logo-box::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glass) 0%,transparent 100%);pointer-events:none;}
.logo-accent-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,var(--accent),var(--accent2));border-radius:0 2px 2px 0;}
.logo-title{font-family:var(--font-mono);font-size:1.05rem;letter-spacing:3px;color:var(--accent);font-weight:700;text-shadow:var(--neon);animation:glowPulse 3s infinite alternate;}
.logo-sub{font-size:0.55rem;opacity:0.4;letter-spacing:2px;margin-top:4px;font-family:var(--font-mono);}
@keyframes glowPulse{from{opacity:.8;text-shadow:var(--neon);}to{opacity:1;text-shadow:0 0 28px var(--accent),0 0 6px var(--accent);}}
.lang-switch{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:30px;padding:4px 5px;margin-top:12px;width:fit-content;}
.lang-btn{font-family:var(--font-mono);font-size:0.6rem;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:20px;cursor:pointer;border:none;background:transparent;color:var(--text-dim);transition:0.25s;}
.lang-btn.active{background:var(--accent);color:#000;box-shadow:var(--neon);}
.nav-section{padding:0 14px;flex:1;overflow-y:auto;}
.nav-section::-webkit-scrollbar{width:3px;}
.nav-section::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.sec-label{font-size:0.58rem;color:var(--accent);letter-spacing:2.5px;margin:18px 0 8px 2px;font-weight:700;opacity:.7;font-family:var(--font-mono);display:flex;align-items:center;gap:6px;}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}
.theme-swatches{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .2s,box-shadow .2s;border:2px solid transparent;}
.swatch:hover{transform:scale(1.2);}
.swatch.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,0.3);transform:scale(1.15);}
.swatch[data-t="1"]{background:#D4AF37;}
.swatch[data-t="2"]{background:linear-gradient(135deg,#00E5CC,#0077AA);}
.swatch[data-t="3"]{background:#C49A6C;}
.swatch[data-t="4"]{background:#A78BFA;}
.swatch[data-t="5"]{background:#F87171;}
.swatch[data-t="6"]{background:#86EFAC;}
.swatch[data-t="7"]{background:#60C8FF;}
.new-chat-btn{width:100%;padding:12px 16px;border:1px solid var(--accent);border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--glass);transition:0.25s;margin-bottom:4px;}
.new-chat-btn:hover{background:rgba(255,255,255,0.07);box-shadow:var(--neon);}
.new-chat-btn span{font-weight:700;font-size:0.8rem;color:var(--accent);font-family:var(--font-mono);}
.byok-toggle-row{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;font-size:0.58rem;color:var(--accent);letter-spacing:2.5px;margin:18px 0 0 2px;font-weight:700;opacity:.7;font-family:var(--font-mono);padding:5px 4px;border-radius:6px;transition:background .2s,opacity .2s;}
.byok-toggle-row:hover{background:var(--glass);opacity:1;}
.byok-arrow{font-size:0.65rem;transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);display:inline-block;}
.byok-arrow.open{transform:rotate(90deg);}
.byok-panel{display:none;background:rgba(0,0,0,0.25);border:1px solid var(--border);border-radius:12px;padding:14px 12px;margin:8px 0 16px;animation:slideDown 0.25s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.byok-group{margin-bottom:10px;}
.byok-group label{display:block;font-size:0.65rem;color:var(--accent);margin-bottom:5px;font-weight:600;font-family:var(--font-mono);}
.byok-group input{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);color:#fff;padding:8px 10px;border-radius:8px;font-size:0.72rem;outline:none;transition:.2s;font-family:var(--font-mono);}
.byok-group input:focus{border-color:var(--accent);box-shadow:var(--neon);}
.btn-byok{width:100%;padding:10px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:6px;transition:.2s;font-family:var(--font-mono);font-size:0.72rem;letter-spacing:1px;}
.btn-byok:hover{opacity:.85;transform:translateY(-1px);}
.history-item{padding:11px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:6px;font-size:0.8rem;cursor:pointer;transition:.2s;background:rgba(0,0,0,0.15);display:flex;align-items:center;white-space:nowrap;overflow:hidden;}
.history-item:hover{border-color:var(--accent);background:var(--glass);}
.history-item.active{border-left:3px solid var(--accent);background:var(--glass);}
.history-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.signature{padding:16px 20px;border-top:1px solid var(--border);font-family:'Playfair Display',serif;font-size:0.75rem;text-align:center;color:var(--accent);opacity:.6;font-style:italic;}
#main{flex:1;display:flex;flex-direction:column;background:transparent;position:relative;min-width:0;}
.main-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.3);backdrop-filter:blur(20px);position:relative;z-index:100;}
.header-left{display:flex;align-items:center;gap:12px;}
.hamburger-btn{background:none;border:none;color:var(--accent);font-size:1.5rem;cursor:pointer;padding:4px 8px;border-radius:8px;transition:.2s;line-height:1;}
.hamburger-btn:hover{background:var(--glass);}
#chat-title{font-weight:700;color:var(--accent);text-shadow:var(--neon);font-size:0.8rem;font-family:var(--font-mono);letter-spacing:1px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dot-menu-btn{background:none;border:none;color:var(--accent);font-size:1.3rem;cursor:pointer;padding:4px 8px;border-radius:8px;transition:.2s;}
.dot-menu-btn:hover{background:var(--glass);}
.dropdown{position:absolute;right:14px;top:54px;background:#111;border:1px solid var(--accent);border-radius:12px;width:190px;display:none;z-index:600;overflow:hidden;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,0.5),var(--neon);animation:popIn .15s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(-4px);}to{opacity:1;transform:scale(1) translateY(0);}}
.dropdown-item{padding:12px 16px;font-size:0.82rem;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);transition:.15s;display:flex;align-items:center;gap:8px;}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:hover{background:var(--glass);}
.dropdown-item.danger{color:#ff6b6b;}
.dropdown-item.danger:hover{background:rgba(255,80,80,0.08);}
#chat-window{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
#chat-window::-webkit-scrollbar{width:3px;}
#chat-window::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:0.9rem;line-height:1.6;animation:msgIn .3s ease;word-break:break-word;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.ai-bubble{align-self:flex-start;background:var(--bubble-ai);border:1px solid var(--border);border-bottom-left-radius:4px;backdrop-filter:blur(12px);}
.user-bubble{align-self:flex-end;background:var(--accent);color:#000;font-weight:600;border-bottom-right-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.chat-img{max-width:100%;border-radius:10px;margin-top:6px;border:1px solid var(--border);display:block;}
.provider-badge{font-size:0.58rem;color:var(--accent);opacity:.55;margin-top:7px;letter-spacing:1px;font-family:var(--font-mono);}
.typing-bubble{align-self:flex-start;background:var(--bubble-ai);border:1px solid var(--border);border-bottom-left-radius:4px;border-radius:18px;padding:14px 18px;animation:msgIn .3s ease;}
.typing-dots{display:flex;gap:5px;align-items:center;}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.4;animation:dotBounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dotBounce{0%,80%,100%{transform:scale(.65);opacity:.35;}40%{transform:scale(1);opacity:1;}}
#plus-menu{position:absolute;bottom:76px;left:12px;background:#111;border:1px solid var(--accent);border-radius:14px;display:none;padding:6px;z-index:600;box-shadow:0 8px 32px rgba(0,0,0,0.6),var(--neon);animation:popIn .15s ease;min-width:155px;backdrop-filter:blur(20px);}
.plus-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-radius:10px;font-size:0.85rem;transition:.15s;user-select:none;}
.plus-item:hover{background:var(--glass);color:var(--accent);}
.input-wrap{padding:10px 12px 14px;background:rgba(0,0,0,0.25);backdrop-filter:blur(20px);border-top:1px solid var(--border);}
.input-island{width:100%;background:rgba(10,10,10,0.8);border:1px solid var(--border);border-radius:100px;padding:5px 6px 5px 5px;display:flex;align-items:center;gap:3px;transition:border-color .2s,box-shadow .2s;}
.input-island:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,255,255,0.05),var(--neon);}
.icon-btn{background:none;border:none;color:rgba(255,255,255,0.5);font-size:1.25rem;cursor:pointer;padding:8px 10px;border-radius:50%;transition:.2s;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:hover{color:var(--accent);background:var(--glass);}
.icon-btn.mic-active{color:#ff6b6b !important;animation:pulse .9s infinite;}
input#userInput{flex:1;background:none;border:none;color:#fff;outline:none;padding:8px 4px;font-size:0.88rem;font-family:var(--font-main);min-width:0;}
input#userInput::placeholder{color:var(--text-dim);}
.send-btn{background:var(--accent);border:none;color:#000;font-weight:800;cursor:pointer;width:36px;height:36px;border-radius:50%;transition:.2s;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn:hover{opacity:.85;transform:scale(1.05);box-shadow:var(--neon);}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;justify-content:center;align-items:center;z-index:2000;backdrop-filter:blur(8px);}
.modal{background:#111;border:1px solid var(--accent);padding:28px 24px;border-radius:20px;width:300px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.6),var(--neon);animation:popIn .2s ease;}
.modal h3{color:var(--accent);margin-bottom:16px;font-size:1rem;letter-spacing:1px;font-family:var(--font-mono);}
.modal input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.5);border:1px solid var(--border);color:#fff;margin:8px 0 16px;border-radius:10px;outline:none;font-family:var(--font-main);font-size:.88rem;transition:.2s;}
.modal input:focus{border-color:var(--accent);box-shadow:var(--neon);}
.modal-btn{background:var(--accent);color:#000;border:none;padding:11px 20px;border-radius:10px;font-weight:700;cursor:pointer;width:100%;font-family:var(--font-mono);font-size:.8rem;letter-spacing:1px;}
.modal-cancel{background:none;color:var(--text-dim);border:1px solid var(--border);padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer;width:100%;font-family:var(--font-main);font-size:.82rem;margin-top:8px;transition:.2s;}
.modal-cancel:hover{border-color:var(--accent);color:#fff;}
#menu-backdrop{display:none;position:fixed;inset:0;z-index:400;}
@keyframes pulse{0%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.15);}100%{opacity:.6;transform:scale(1);}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:10px 22px;border-radius:30px;font-weight:700;font-size:.78rem;z-index:3000;font-family:var(--font-mono);letter-spacing:1px;opacity:0;animation:toastAnim 2.6s ease forwards;box-shadow:var(--neon);white-space:nowrap;}
@keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(10px);}15%{opacity:1;transform:translateX(-50%) translateY(0);}75%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-6px);}}
</style>
</head>
<body class="theme-1" id="appBody">

<aside id="sidebar">
  <div class="logo-box">
    <div class="logo-accent-bar"></div>
    <div class="logo-title" data-i18n="app_title">ASISTEN AI VG</div>
    <div class="logo-sub" data-i18n="app_sub">ARCHITECT PRO</div>
    <div class="lang-switch">
      <button class="lang-btn active" id="lang-id" onclick="setLang('id')">ID</button>
      <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="nav-section">
    <div class="sec-label" data-i18n="theme_label">PILIH TEMA</div>
    <div class="theme-swatches">
      <div class="swatch active" data-t="1" onclick="setTheme(1)" title="Obsidian Gold"></div>
      <div class="swatch" data-t="2" onclick="setTheme(2)" title="Aurora Night ✦"></div>
      <div class="swatch" data-t="3" onclick="setTheme(3)" title="Mocha Mousse 2025"></div>
      <div class="swatch" data-t="4" onclick="setTheme(4)" title="Digital Lavender ✦"></div>
      <div class="swatch" data-t="5" onclick="setTheme(5)" title="Midnight Cherry"></div>
      <div class="swatch" data-t="6" onclick="setTheme(6)" title="Sage Mist"></div>
      <div class="swatch" data-t="7" onclick="setTheme(7)" title="Glacier Ice"></div>
    </div>
    <div class="sec-label" data-i18n="engine_label">ENGINE</div>
    <div class="new-chat-btn" onclick="newChat()">
      <span style="font-size:1rem">⚡</span>
      <span data-i18n="new_chat_btn">SESI BARU</span>
    </div>
    <div class="byok-toggle-row" onclick="toggleByok()">
      <span data-i18n="byok_label">BRING YOUR OWN KEY</span>

      <div class="byok-group"><label>Hugging Face</label><input type="password" id="byok-huggingface" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <div class="byok-group"><label>Mistral AI</label><input type="password" id="byok-mistral" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <div class="byok-group"><label>Open Router</label><input type="password" id="byok-openrouter" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <div class="byok-group"><label>Together AI</label><input type="password" id="byok-together" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <div class="byok-group"><label>Cohere AI</label><input type="password" id="byok-cohere" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <div class="byok-group"><label>Mancer</label><input type="password" id="byok-mancer" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <div class="byok-group"><label>Deepintra</label><input type="password" id="byok-deepintra" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <div class="byok-group"><label>Google AI Studio</label><input type="password" id="byok-googlestudio" data-ph-i18n="byok_placeholder" placeholder="Masukkan API Key..."></div>
      <button class="btn-byok" onclick="saveByokKeys()" data-i18n="byok_save_btn">SIMPAN KEYS</button>
    </div>
    <div class="sec-label" data-i18n="history_label">RIWAYAT</div>
    <div id="history-list"></div>
  </div>
  <div class="signature" data-i18n="signature">by Vivi Gioncyn</div>
</aside>

<main id="main">
  <header class="main-header">
    <div class="header-left">
      <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
      <div id="chat-title" data-i18n="engine_standby">ENGINE STANDBY</div>
    </div>
    <button class="dot-menu-btn" onclick="toggleMenu(event)">⋮</button>
  </header>

  <div class="dropdown" id="dotMenu">
    <div class="dropdown-item" onclick="pinChat()"><span>📌</span><span data-i18n="pin_chat">Sematkan</span></div>
    <div class="dropdown-item" onclick="openRename()"><span>✎</span><span data-i18n="rename_chat">Ganti Nama</span></div>
    <div class="dropdown-item danger" onclick="deleteSession()"><span>✕</span><span data-i18n="delete_chat">Hapus Sesi</span></div>
  </div>

  <div id="chat-window">
    <div class="bubble ai-bubble" id="welcome-bubble">Selamat datang di <strong>ASISTEN AI VG</strong>. Menunggu instruksi...</div>
  </div>

  <div id="plus-menu">
    <label class="plus-item" for="camIn" onclick="closePlusMenu()">📷 <span data-i18n="menu_camera">Kamera</span></label>
    <label class="plus-item" for="galIn" onclick="closePlusMenu()">🖼️ <span data-i18n="menu_gallery">Galeri</span></label>
    <label class="plus-item" for="fileIn" onclick="closePlusMenu()">📁 <span data-i18n="menu_file">File</span></label>
  </div>

  <input type="file" id="camIn" hidden accept="image/*" capture="environment" onchange="handleFile(event)">
  <input type="file" id="galIn" hidden accept="image/*" onchange="handleFile(event)">
  <input type="file" id="fileIn" hidden onchange="handleFile(event)">

  <div class="input-wrap">
    <div class="input-island">
      <button class="icon-btn" onclick="togglePlus(event)">＋</button>
      <input type="text" id="userInput" data-ph-i18n="input_placeholder" placeholder="Tulis perintah..."
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}">
      <button class="icon-btn" id="micBtn" onclick="runMic()">🎙️</button>
      <button class="send-btn" onclick="sendMsg()">➔</button>
    </div>
  </div>
</main>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 data-i18n="rename_modal_title">Ubah Nama Sesi</h3>
    <input type="text" id="nameInput" data-ph-i18n="rename_placeholder" placeholder="Nama baru..."
      onkeydown="if(event.key==='Enter')saveName()">
    <button class="modal-btn" onclick="saveName()" data-i18n="save_btn">SIMPAN</button>
    <button class="modal-cancel" onclick="closeModal()" data-i18n="cancel_btn">Batal</button>
  </div>
</div>

<div id="menu-backdrop" onclick="closeAllMenus()"></div>

<script>
// ── TRANSLATIONS ──────────────────────────────────────────
const TR = {
  id:{app_title:'ASISTEN AI VG',app_sub:'ARCHITECT PRO',theme_label:'PILIH TEMA',engine_label:'ENGINE',new_chat_btn:'SESI BARU',byok_label:'BRING YOUR OWN KEY',byok_placeholder:'Masukkan API Key...',byok_save_btn:'SIMPAN KEYS',history_label:'RIWAYAT',input_placeholder:'Tulis perintah...',welcome_html:'Selamat datang di <strong>ASISTEN AI VG</strong>. Menunggu instruksi...',new_session_msg:'Sesi baru dimulai. AI siap.',pin_chat:'Sematkan',rename_chat:'Ganti Nama',delete_chat:'Hapus Sesi',rename_modal_title:'Ubah Nama Sesi',rename_placeholder:'Nama baru...',save_btn:'SIMPAN',cancel_btn:'Batal',byok_saved:'✓ API Keys berhasil disimpan!',mic_not_supported:'Microphone tidak didukung di browser ini.',mic_error:'Mic error: ',no_key_msg:'Belum ada API Key. Buka sidebar dan simpan minimal satu key.',engine_standby:'ENGINE STANDBY',new_session_title:'SESI BARU',confirm_delete:'Hapus sesi ini?',menu_camera:'Kamera',menu_gallery:'Galeri',menu_file:'File',signature:'by Vivi Gioncyn',via_label:'via'},
  en:{app_title:'AI VG ASSISTANT',app_sub:'ARCHITECT PRO',theme_label:'SELECT THEME',engine_label:'ENGINE',new_chat_btn:'NEW SESSION',byok_label:'BRING YOUR OWN KEY',byok_placeholder:'Enter API Key...',byok_save_btn:'SAVE KEYS',history_label:'HISTORY',input_placeholder:'Write a command...',welcome_html:'Welcome to <strong>AI VG ASSISTANT</strong>. Awaiting instructions...',new_session_msg:'New session started. AI ready.',pin_chat:'Pin Chat',rename_chat:'Rename',delete_chat:'Delete Session',rename_modal_title:'Rename Session',rename_placeholder:'New name...',save_btn:'SAVE',cancel_btn:'Cancel',byok_saved:'✓ API Keys saved successfully!',mic_not_supported:'Microphone is not supported in this browser.',mic_error:'Mic error: ',no_key_msg:'No API Key found. Open sidebar and save at least one key.',engine_standby:'ENGINE STANDBY',new_session_title:'NEW SESSION',confirm_delete:'Delete this session?',menu_camera:'Camera',menu_gallery:'Gallery',menu_file:'File',signature:'by Vivi Gioncyn',via_label:'via'}
};
let currentLang=localStorage.getItem('vg_lang')||'id';
function t(k){return TR[currentLang][k]||TR.id[k]||k;}
function applyLang(){
  document.documentElement.lang=currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(TR[currentLang][k]!==undefined)el.textContent=TR[currentLang][k];});
  document.querySelectorAll('[data-ph-i18n]').forEach(el=>{const k=el.getAttribute('data-ph-i18n');if(TR[currentLang][k]!==undefined)el.placeholder=TR[currentLang][k];});
  document.getElementById('lang-id').classList.toggle('active',currentLang==='id');
  document.getElementById('lang-en').classList.toggle('active',currentLang==='en');
  const wb=document.getElementById('welcome-bubble');
  if(wb)wb.innerHTML=t('welcome_html');
  const ct=document.getElementById('chat-title');
  if(ct.textContent===TR.id.engine_standby||ct.textContent===TR.en.engine_standby)ct.textContent=t('engine_standby');
}
function setLang(l){currentLang=l;localStorage.setItem('vg_lang',l);applyLang();}

// ── AI PROVIDERS ──────────────────────────────────────────
const AI_PROVIDERS=[
  {name:'Gemini Flash',getKey:()=>localStorage.getItem('BYOK_GEMINI')||localStorage.getItem('BYOK_GOOGLESTUDIO'),call:async(key,msgs)=>{const contents=msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'Gemini error');return d.candidates[0].content.parts[0].text;}},
  {name:'OpenRouter',getKey:()=>localStorage.getItem('BYOK_OPENROUTER'),call:async(key,msgs)=>{const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json','HTTP-Referer':location.href},body:JSON.stringify({model:'mistralai/mistral-7b-instruct:free',messages:msgs})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'OpenRouter error');return d.choices[0].message.content;}},
  {name:'Groq (Llama3)',getKey:()=>localStorage.getItem('BYOK_GROQ'),call:async(key,msgs)=>{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({model:'llama3-8b-8192',messages:msgs})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'Groq error');return d.choices[0].message.content;}},
  {name:'Together AI',getKey:()=>localStorage.getItem('BYOK_TOGETHER'),call:async(key,msgs)=>{const r=await fetch('https://api.together.xyz/v1/chat/completions',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({model:'meta-llama/Llama-3-8b-chat-hf',messages:msgs})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'Together error');return d.choices[0].message.content;}},
  {name:'Mistral AI',getKey:()=>localStorage.getItem('BYOK_MISTRAL'),call:async(key,msgs)=>{const r=await fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({model:'mistral-small-latest',messages:msgs})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'Mistral error');return d.choices[0].message.content;}},
  {name:'Cohere AI',getKey:()=>localStorage.getItem('BYOK_COHERE'),call:async(key,msgs)=>{const history=msgs.slice(0,-1).map(m=>({role:m.role==='assistant'?'CHATBOT':'USER',message:m.content}));const lastMsg=msgs[msgs.length-1].content;const r=await fetch('https://api.cohere.com/v1/chat',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({model:'command-r-plus',message:lastMsg,chat_history:history})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Cohere error');return d.text;}},
  {name:'HuggingFace',getKey:()=>localStorage.getItem('BYOK_HUGGINGFACE'),call:async(key,msgs)=>{const prompt=msgs.map(m=>`${m.role==='user'?'Human':'Assistant'}: ${m.content}`).join('\n')+'\nAssistant:';const r=await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2',{method:'POST',headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json'},body:JSON.stringify({inputs:prompt,parameters:{max_new_tokens:512,return_full_text:false}})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'HuggingFace error');return Array.isArray(d)?d[0].generated_text.trim():d.generated_text;}}
];
async function callAI(msgs){
  const errors=[];
  for(const p of AI_PROVIDERS){const key=p.getKey();if(!key)continue;try{const res=await p.call(key,msgs);return{text:res,source:p.name};}catch(e){errors.push(`${p.name}: ${e.message}`);}}
  throw new Error(errors.length?errors.join('\n'):t('no_key_msg'));
}

// ── STATE ─────────────────────────────────────────────────
let currentSessId=null,sessions=JSON.parse(localStorage.getItem('vg_sessions'))||[],conversationHistory=[],micRec=null,currentTheme=parseInt(localStorage.getItem('vg_theme')||'1');
const byokProviders=['gemini','groq','huggingface','mistral','openrouter','together','cohere','mancer','deepintra','googlestudio'];

// ── BYOK ──────────────────────────────────────────────────
function toggleByok(){const p=document.getElementById('byok-panel'),a=document.getElementById('byok-arrow'),open=p.style.display==='block';p.style.display=open?'none':'block';a.classList.toggle('open',!open);}
function saveByokKeys(){byokProviders.forEach(p=>{const v=document.getElementById(`byok-${p}`).value.trim();v?localStorage.setItem(`BYOK_${p.toUpperCase()}`,v):localStorage.removeItem(`BYOK_${p.toUpperCase()}`);});showToast(t('byok_saved'));}
function loadByokKeys(){byokProviders.forEach(p=>{const s=localStorage.getItem(`BYOK_${p.toUpperCase()}`);if(s)document.getElementById(`byok-${p}`).value=s;});}

// ── THEME ─────────────────────────────────────────────────
function setTheme(n){document.getElementById('appBody').className='theme-'+n;currentTheme=n;localStorage.setItem('vg_theme',n);document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',parseInt(s.dataset.t)===n));}

// ── MENUS ─────────────────────────────────────────────────
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('closed');closeAllMenus();}
function closeAllMenus(){document.getElementById('dotMenu').style.display='none';document.getElementById('plus-menu').style.display='none';document.getElementById('menu-backdrop').style.display='none';}
function toggleMenu(e){if(e)e.stopPropagation();const m=document.getElementById('dotMenu'),open=m.style.display==='block';closeAllMenus();if(!open){m.style.display='block';document.getElementById('menu-backdrop').style.display='block';}}
function togglePlus(e){if(e)e.stopPropagation();const p=document.getElementById('plus-menu'),open=p.style.display==='block';closeAllMenus();if(!open){p.style.display='block';document.getElementById('menu-backdrop').style.display='block';}}
function closePlusMenu(){setTimeout(()=>closeAllMenus(),80);}

// ── FILES ─────────────────────────────────────────────────
function handleFile(e){const f=e.target.files[0];if(!f)return;e.target.value='';const r=new FileReader();r.onload=ev=>{const c=f.type.startsWith('image/')?`<img src="${ev.target.result}" class="chat-img" alt="img">`:` <strong>${f.name}</strong>`;addMessage('user',c);};r.readAsDataURL(f);}

// ── CHAT ──────────────────────────────────────────────────
function newChat(){currentSessId=Date.now();conversationHistory=[];document.getElementById('chat-window').innerHTML=`<div class="bubble ai-bubble">${t('new_session_msg')}</div>`;document.getElementById('chat-title').textContent=t('new_session_title');document.getElementById('sidebar').classList.add('closed');closeAllMenus();}
async function sendMsg(){const inp=document.getElementById('userInput'),txt=inp.value.trim();if(!txt)return;if(!currentSessId)currentSessId=Date.now();inp.value='';addMessage('user',txt);conversationHistory.push({role:'user',content:txt});const tid='t-'+Date.now();addTyping(tid);try{const{text,source}=await callAI(conversationHistory);removeTyping(tid);addMessage('ai',text,source);conversationHistory.push({role:'assistant',content:text});saveSession(txt);}catch(e){removeTyping(tid);addMessage('ai',`${e.message}`);}}
function addTyping(id){const w=document.getElementById('chat-window'),b=document.createElement('div');b.id=id;b.className='typing-bubble';b.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';w.appendChild(b);w.scrollTop=w.scrollHeight;}
function removeTyping(id){const e=document.getElementById(id);if(e)e.remove();}
function addMessage(who,html,src){const w=document.getElementById('chat-window'),b=document.createElement('div');b.className=`bubble ${who}-bubble`;b.innerHTML=html;if(who==='ai'&&src){const badge=document.createElement('div');badge.className='provider-badge';badge.textContent=`▸ ${t('via_label')} ${src}`;b.appendChild(badge);}w.appendChild(b);w.scrollTop=w.scrollHeight;}

// ── SESSIONS ──────────────────────────────────────────────
function saveSession(msg){let s=sessions.find(x=>x.id===currentSessId);if(!s){s={id:currentSessId,title:msg.substring(0,22),messages:'',pinned:false};sessions.unshift(s);}s.messages=document.getElementById('chat-window').innerHTML;localStorage.setItem('vg_sessions',JSON.stringify(sessions));renderHistory();}
function renderHistory(){const l=document.getElementById('history-list');l.innerHTML='';sessions.forEach(s=>{const d=document.createElement('div');d.className=`history-item${s.id===currentSessId?' active':''}`;d.innerHTML=`<span>${s.pinned?'📌 ':''}${s.title}</span>`;d.onclick=()=>loadSession(s.id);l.appendChild(d);});}
function loadSession(id){currentSessId=id;const s=sessions.find(x=>x.id===id);document.getElementById('chat-window').innerHTML=s.messages;document.getElementById('chat-title').textContent=s.title.toUpperCase();conversationHistory=[];renderHistory();document.getElementById('sidebar').classList.add('closed');closeAllMenus();}

// FIX: hapus sesi — ganti toggleMenu() dengan direct hide
function deleteSession(){if(!currentSessId)return;if(!confirm(t('confirm_delete')))return;sessions=sessions.filter(s=>s.id!==currentSessId);localStorage.setItem('vg_sessions',JSON.stringify(sessions));document.getElementById('dotMenu').style.display='none';document.getElementById('menu-backdrop').style.display='none';currentSessId=null;newChat();renderHistory();}
function pinChat(){const s=sessions.find(x=>x.id===currentSessId);if(s)s.pinned=!s.pinned;sessions.sort((a,b)=>b.pinned-a.pinned);localStorage.setItem('vg_sessions',JSON.stringify(sessions));renderHistory();document.getElementById('dotMenu').style.display='none';document.getElementById('menu-backdrop').style.display='none';}
function openRename(){document.getElementById('modal-overlay').style.display='flex';document.getElementById('dotMenu').style.display='none';document.getElementById('menu-backdrop').style.display='none';setTimeout(()=>document.getElementById('nameInput').focus(),100);}
function saveName(){const v=document.getElementById('nameInput').value.trim();if(v&&currentSessId){const s=sessions.find(x=>x.id===currentSessId);if(s)s.title=v;document.getElementById('chat-title').textContent=v.toUpperCase();localStorage.setItem('vg_sessions',JSON.stringify(sessions));renderHistory();}closeModal();}
function closeModal(){document.getElementById('modal-overlay').style.display='none';document.getElementById('nameInput').value='';}

// FIX: microphone — toggle, error handling, language-aware, auto-send
function runMic(){
  const S=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!S){showToast(t('mic_not_supported'));return;}
  if(micRec){micRec.abort();micRec=null;document.getElementById('micBtn').classList.remove('mic-active');return;}
  micRec=new S();
  micRec.lang=currentLang==='id'?'id-ID':'en-US';
  micRec.continuous=false;micRec.interimResults=false;micRec.maxAlternatives=1;
  micRec.onstart=()=>document.getElementById('micBtn').classList.add('mic-active');
  micRec.onend=()=>{document.getElementById('micBtn').classList.remove('mic-active');micRec=null;};
  micRec.onresult=e=>{document.getElementById('userInput').value=e.results[0][0].transcript;setTimeout(()=>sendMsg(),300);};
  micRec.onerror=e=>{document.getElementById('micBtn').classList.remove('mic-active');micRec=null;if(e.error!=='aborted'&&e.error!=='no-speech')showToast(t('mic_error')+e.error);};
  try{micRec.start();}catch(e){micRec=null;showToast(t('mic_error')+e.message);}
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg){const ex=document.querySelector('.toast');if(ex)ex.remove();const t2=document.createElement('div');t2.className='toast';t2.textContent=msg;document.body.appendChild(t2);setTimeout(()=>t2.remove(),2700);}

// ── INIT ──────────────────────────────────────────────────
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setTheme(currentTheme);loadByokKeys();applyLang();renderHistory();
</script>
</body>
</html>
